<!DOCTYPE html>
<html>

<head>

    <title>Zeno Dashboard</title>

    <style>

        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body{
            font-family: Arial;
            background: #0f172a;
            color: white;
        }

        .container{
            display: flex;
            height: 100vh;
        }

        /*
        ===================================
        CHAT SECTION
        ===================================
        */

        .chat-section{

            width: 60%;

            padding: 20px;

            border-right: 1px solid #334155;

            display: flex;

            flex-direction: column;
        }

        .top-bar{

            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-bottom: 20px;
        }

        .logout-btn{

            background: red;

            color: white;

            border: none;

            padding: 10px 15px;

            border-radius: 5px;

            cursor: pointer;
        }

        .chat-box{

            flex: 1;

            background: #1e293b;

            padding: 20px;

            border-radius: 10px;

            overflow-y: auto;
        }

        .message{

            background: #334155;

            padding: 12px;

            border-radius: 5px;

            margin-top: 10px;

            line-height: 1.5;
        }

        .input-box{

            display: flex;

            margin-top: 15px;
        }

        .input-box input{

            flex: 1;

            padding: 12px;

            border: none;

            border-radius: 5px;

            font-size: 15px;
        }

        .input-box button{

            padding: 12px 20px;

            border: none;

            background: #2563eb;

            color: white;

            margin-left: 10px;

            border-radius: 5px;

            cursor: pointer;
        }

        /*
        ===================================
        ORDERS SECTION
        ===================================
        */

        .orders-section{

            width: 40%;

            padding: 20px;

            overflow-y: auto;
        }

        .order-card{

            background: #1e293b;

            padding: 15px;

            border-radius: 10px;

            margin-top: 15px;
        }

        .order-card h3{

            margin-bottom: 10px;
        }

        .order-card p{

            margin-top: 5px;
        }

        .status{

            margin-top: 10px;

            font-weight: bold;

            color: #38bdf8;
        }

    </style>

</head>

<body>

<div class="container">

    <!-- ================================= -->
    <!-- CHAT SECTION -->
    <!-- ================================= -->

    <div class="chat-section">

        <div class="top-bar">

            <h1>Zeno AI Chatbot</h1>

            <button
                class="logout-btn"
                onclick="logout()"
            >
                Logout
            </button>

        </div>

        <!-- CHAT MESSAGES -->

        <div
            class="chat-box"
            id="chatBox"
        >

        </div>

        <!-- CHAT INPUT -->

        <div class="input-box">

            <input
                type="text"
                id="message"
                placeholder="Need 500 titanium bolts by Friday"
            >

            <button onclick="sendMessage()">
                Send
            </button>

        </div>

    </div>

    <!-- ================================= -->
    <!-- ORDERS SECTION -->
    <!-- ================================= -->

    <div class="orders-section">

        <h1>My Orders</h1>

        <div id="ordersContainer"></div>

    </div>

</div>

<script>

/* ===================================
CHECK LOGIN
=================================== */

let token = localStorage.getItem("token");
console.log(token);

if(!token){

    window.location.href =
    "login.html";
}

/* ===================================
SEND MESSAGE TO CHATBOT
=================================== */

async function sendMessage(){

    let message =
    document.getElementById("message").value;

    if(message == "") return;

    /*
    -----------------------------------
    SHOW USER MESSAGE
    -----------------------------------
    */

    document.getElementById("chatBox")
    .innerHTML += `

        <div class="message">

            <b>You:</b><br>

            ${message}

        </div>
    `;

    /*
    -----------------------------------
    SEND TO chat.php
    -----------------------------------
    */

    let response = await fetch(

        "http://localhost:8080/zeno/chat.php",

        {

            method: "POST",

            headers: {

                "Content-Type": "application/json",

                "Authorization":
                `Bearer ${token}`

            },

            body: JSON.stringify({

                message: message

            })

        }
    );

    let data = await response.json();

    console.log(data);

    /*
    -----------------------------------
    SHOW BOT RESPONSE
    -----------------------------------
    */

    document.getElementById("chatBox")
    .innerHTML += `

        <div class="message">

            <b>Zeno AI:</b><br>

            ${data.message}

        </div>
    `;

    /*
    -----------------------------------
    CLEAR INPUT
    -----------------------------------
    */

    document.getElementById("message")
    .value = "";

    /*
    -----------------------------------
    REFRESH ORDERS
    -----------------------------------
    */

    loadOrders();
}

/* ===================================
LOAD USER ORDERS
=================================== */

async function loadOrders(){

    let response = await fetch(

        "http://localhost:8080/zeno/get_user_orders.php",

        {

            headers: {

                "Authorization":
                `Bearer ${token}`

            }

        }

    );

    let data = await response.json();

    console.log(data);

    let html = "";

    /*
    -----------------------------------
    CREATE ORDER CARDS
    -----------------------------------
    */

    data.orders.forEach(order => {

        html += `

            <div class="order-card">

                <h3>
                    ${order.part_name}
                </h3>

                <p>

                    <b>Material:</b>

                    ${order.material}

                </p>

                <p>

                    <b>Quantity:</b>

                    ${order.quantity}

                </p>

                <p>

                    <b>Deadline:</b>

                    ${order.deadline}

                </p>

                <div class="status">

                    ${order.status}

                </div>

            </div>
        `;
    });

    document.getElementById(
        "ordersContainer"
    ).innerHTML = html;
}

/* ===================================
LOGOUT
=================================== */

function logout(){

    localStorage.removeItem("token");

    window.location.href =
    "login.html";
}

/* ===================================
INITIAL LOAD
=================================== */

loadOrders();

</script>

</body>
</html>
