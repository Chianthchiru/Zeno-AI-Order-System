<!DOCTYPE html>
<html>

<head>

    <title>Zeno Login</title>

    <style>

        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body{

            font-family: Arial;

            background: #0f172a;

            height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;
        }

        .login-box{

            width: 350px;

            background: white;

            padding: 30px;

            border-radius: 10px;

            box-shadow: 0 0 20px rgba(0,0,0,0.3);
        }

        h1{

            text-align: center;

            margin-bottom: 25px;

            color: #111827;
        }

        input{

            width: 100%;

            padding: 12px;

            margin-top: 12px;

            border: 1px solid #ccc;

            border-radius: 5px;

            font-size: 15px;
        }

        button{

            width: 100%;

            padding: 12px;

            margin-top: 20px;

            border: none;

            background: #2563eb;

            color: white;

            font-size: 16px;

            border-radius: 5px;

            cursor: pointer;
        }

        button:hover{

            background: #1d4ed8;
        }

        #message{

            margin-top: 15px;

            text-align: center;

            font-weight: bold;
        }

        a{

            display: block;

            text-align: center;

            margin-top: 15px;

            text-decoration: none;
        }

    </style>

</head>

<body>

    <div class="login-box">

        <h1>Zeno Login</h1>

        <input
            type="email"
            id="email"
            placeholder="Enter Email"
        >

        <input
            type="password"
            id="password"
            placeholder="Enter Password"
        >

        <button onclick="login()">
            Login
        </button>

        <div id="message"></div>

        <a href="signup.html">
            Create Account
        </a>

    </div>

    <script>

        async function login(){

            let email =
            document.getElementById("email").value;

            let password =
            document.getElementById("password").value;

            let response = await fetch(

                "http://localhost:8080/zeno/login.php",

                {

                    method: "POST",

                    headers: {

                        "Content-Type": "application/json"

                    },

                    body: JSON.stringify({

                        email: email,

                        password: password

                    })

                }

            );

            let data = await response.json();

            console.log(data);

            if(data.success){

                localStorage.setItem(
                    "token",
                    data.token
                );

                document.getElementById("message")
                .innerHTML =
                "Login Successful";

                setTimeout(() => {

                    window.location.href =
                    "dashboard.html";

                }, 1000);

            } else {

                document.getElementById("message")
                .innerHTML =
                data.message;

            }

        }

    </script>

</body>
</html>
